{% extends "base.html" %}
{% block title %}Forgotten password - Auraline{% endblock %}

{% block content %}
<section class="wrap signin">
  <div class="signin__head">
    <p class="eyebrow">Forgotten password</p>
    <h1>Let us send you a link.</h1>
    <p class="muted">Enter the email address you signed up with.</p>
  </div>

  <form method="post" class="panel" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" maxlength="320" required
             autocomplete="email" autofocus>
    </div>

    <button type="submit" class="btn btn--primary btn--block">Send reset link</button>
  </form>

  <p class="alt-action">
    Remembered it? <a href="{{ url_for('auth.login') }}">Sign in</a>.
  </p>
</section>
{% endblock %}
